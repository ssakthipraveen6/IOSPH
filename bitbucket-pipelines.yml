image: node:20

pipelines:
  default:
    - step:
        name: Security Audit & SAST Quality Gates
        caches:
          - node
        script:
          - cd sentinel-webdesign
          - npm ci
          - npm audit --audit-level=high
          - npm run lint
    - step:
        name: Unit & Integration Regression Test Suite
        caches:
          - node
        script:
          - cd sentinel-webdesign
          - npm ci
          - npm test
    - step:
        name: Build & Verify Artifacts
        caches:
          - node
        script:
          - cd sentinel-webdesign
          - npm ci
          - npm run build
          - npm run verify:dist

  branches:
    main:
      - step:
          name: Pre-Release Hardened Verification (Audit, Lint, Test, Build)
          caches:
            - node
          script:
            - cd sentinel-webdesign
            - npm ci
            - npm audit --audit-level=high
            - npm run lint
            - npm test
            - npm run build
            - npm run verify:dist
      - step:
          name: Production Deployment Gate (CAB & SRE Approval)
          trigger: manual
          script:
            - echo "Deploying verified Project Sentinel release to Enterprise Infrastructure..."
            - cd sentinel-webdesign
            - npm run preflight
