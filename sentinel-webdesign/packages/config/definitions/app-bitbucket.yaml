# =========================================================================
# UNIFIED COLLECTION DEFINITION: Bitbucket Enterprise SCM
# Encapsulates Identity, Endpoints, Metrics, Logs, Credentials, & SRE Runbook
# =========================================================================
id: "bitbucket"
kind: "application"
display_name: "Bitbucket Enterprise SCM"
category: "source_control"
tier: "Tier-1 Mission Critical"
log_tag: "[BB-NET]"

endpoints:
  prod:
    api: "https://bitbucket-prod.internal.corp/rest/api/1.0"
  stg:
    api: "https://bitbucket-stg.internal.corp/rest/api/1.0"

layers:
  sso:
    api: "https://sso-auth-prod-bitbucket.internal.corp/oauth2/token"
    credential_purpose: "sso"
  avi:
    api: "https://avi-prod-bitbucket.internal.corp/api/v1/telemetry"
    credential_purpose: null
  nfs:
    mount: "/mnt/nfs/production_shares/bitbucket"
    credential_purpose: null
  db:
    jdbc: "jdbc:postgresql://db-prod-bitbucket.internal.corp:5432/bitbucket_db"
    credential_purpose: "db"
  s3:
    endpoint: "https://s3.prod-bitbucket-us-east-1.amazonaws.com"
    credential_purpose: null
  docker:
    registry_api: "https://registry-prod.internal.corp/v2/bitbucket"
    credential_purpose: null
  k8s:
    api: "https://k8s-apiserver-prod.internal.corp:6443"
    namespace: "bitbucket-prod"
    credential_purpose: null
  network_latency_hosts:
    - "bitbucket-prod.internal.corp"

servers:
  unix:
    - node: "bitbucket-node-1"
      api: "https://linux-compute-prod-bitbucket-1.internal.corp/api/v1/metrics"
    - node: "bitbucket-node-2"
      api: "https://linux-compute-prod-bitbucket-2.internal.corp/api/v1/metrics"
  windows: []

# Telemetry & Metrics Collection Policy
metrics:
  provider: "opentelemetry"
  scrape_interval: "30s"
  health_thresholds:
    jvm_heap_warning_pct: 80
    jvm_heap_critical_pct: 90
    response_time_warn_ms: 500
    response_time_crit_ms: 1200
  monitored_metrics:
    - "jvm.memory.used"
    - "process.cpu.utilization"
    - "http.server.duration"
    - "git.active_ssh_sessions"

metrics_baseline:
  responseTime: 85
  successRate: 99.8
  requests: 45

# Log Collection & Retention Policy
logs:
  log_tag: "[BB-NET]"
  log_path: "d:\\production_shares\\nas_logs\\bitbucket_audit.log"
  retention_days: 30
  rotation_size: "10M"
  compression: "gzip"

# CyberArk Vault Credential Mapping
credentials:
  safe: "SF-BITBUCKET-PROD"
  objects:
    db: "BITBUCKET-DB-SVC"
    sso: "BITBUCKET-SSO-SVC"
    api_token: "BITBUCKET-API-TOKEN"

# Automated SRE Self-Healing Playbook
jenkins_remediation_job: "JOB_RESTART_BITBUCKET_SERVICE"
