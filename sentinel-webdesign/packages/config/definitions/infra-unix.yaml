# =========================================================================
# UNIFIED COLLECTION DEFINITION: Linux / Unix Compute Nodes
# =========================================================================
id: "unix"
kind: "infrastructure"
display_name: "Linux / Unix Compute Nodes"
category: "compute"
poll_interval_seconds: 30
credential_purpose: "ssh"
api: "https://linux-compute-prod.internal.corp/api/v1/metrics"

metrics:
  provider: "opentelemetry"
  exporter_port: 9100
  scrape_interval: "30s"
  monitored_metrics:
    - "node_cpu_seconds_total"
    - "node_memory_MemAvailable_bytes"
    - "node_filesystem_free_bytes"
    - "node_load1"

logs:
  log_tag: "[LINUX-HOST]"
  log_path: "d:\\production_shares\\nas_logs\\linux_hosts.log"

credentials:
  safe: "SF-INFRA-UNIX"
  objects:
    ssh: "UNIX-COMPUTE-SVC"
