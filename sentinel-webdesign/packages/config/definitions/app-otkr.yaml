# =========================================================================
# UNIFIED COLLECTION DEFINITION: OpenText Key Orchestration (OTKR)
# =========================================================================
id: "otkr"
kind: "application"
display_name: "OpenText Key Orchestration (OTKR)"
category: "key_management"
tier: "Tier-1 Mission Critical"
log_tag: "[OTKR]"

endpoints:
  prod:
    api: "https://otkr-prod.internal.corp/api/v1"
  stg:
    api: "https://otkr-stg.internal.corp/api/v1"

layers:
  db:
    jdbc: "jdbc:postgresql://db-prod-otkr.internal.corp:5432/otkr_db"
    credential_purpose: "db"
  api_token:
    credential_purpose: "api_token"
  avi:
    api: "https://avi-prod-otkr.internal.corp/api/v1/telemetry"
    credential_purpose: null

servers:
  unix:
    - node: "otkr-server-1"
      api: "https://linux-compute-prod-otkr-1.internal.corp/api/v1/metrics"
  windows: []

metrics:
  provider: "opentelemetry"
  scrape_interval: "30s"

metrics_baseline:
  responseTime: 100
  successRate: 99.8
  requests: 50

logs:
  log_tag: "[OTKR]"
  log_path: "d:\\production_shares\\nas_logs\\otkr.log"

credentials:
  safe: "SF-OTKR-PROD"
  objects:
    db: "OTKR-DB-SVC"
    api_token: "OTKR-API-TOKEN"

jenkins_remediation_job: "JOB_RESTART_OTKR_SERVICE"
