id: "artifactory"
display_name: "JFrog Artifactory Enterprise"
category: "artifact_repository"
log_tag: "[ARTIFACTORY]"

endpoints:
  prod:
    api: "https://artifactory-prod.internal.corp/artifactory/api"
  stg:
    api: "https://artifactory-stg.internal.corp/artifactory/api"

layers:
  s3:
    endpoint: "https://s3.prod-artifactory-us-east-1.amazonaws.com"
    credential_purpose: null
  db:
    jdbc: "jdbc:postgresql://db-prod-artifactory.internal.corp:5432/artifactory_db"
    credential_purpose: null
  avi:
    api: "https://avi-prod-artifactory.internal.corp/api/v1/telemetry"
    credential_purpose: null

servers:
  unix:
    - node: "artifactory-node-1"
      api: "https://linux-compute-prod-artifactory-1.internal.corp/api/v1/metrics"
  windows: []

metrics_baseline:
  responseTime: 95
  successRate: 99.9
  requests: 120

jenkins_remediation_job: "JOB_RESTART_ARTIFACTORY_SERVICE"
