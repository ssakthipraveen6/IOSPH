# =========================================================================
# Project Sentinel: Enterprise Fluent Bit Base Configuration (Phase 3b / T3b.1)
# Features: Persistent Tail, Redaction Filters (PANs, Tokens, PII), Sentinel Ingest
# =========================================================================

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Tag               app.log
    Path              /var/log/apps/*.log,/opt/sentinel/logs/*.log
    DB                /var/log/fluentbit_tail.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# =========================================================================
# Redaction Filters (T3b.6 — Strip Tokens, Secrets, PANs & PII at the Host)
# =========================================================================
[FILTER]
    Name          modify
    Match         *
    # Mask Credit Card Numbers / PANs (13 to 19 digits)
    Condition     Key_Value_Matches message \b(?:\d[ -]*?){13,19}\b
    Set           redacted_pan true

[FILTER]
    Name          rewrite_tag
    Match         app.log
    Rule          $message "(?i)(password|secret|bearer\s+[a-zA-Z0-9_\-\.]+)" sensitive.masked false

[FILTER]
    Name          modify
    Match         *
    Add           deployment.environment ${SENTINEL_ENV}
    Add           host.name ${HOSTNAME}
    Add           shipper.version 3.0.4

# =========================================================================
# Sentinel HTTP Output (POST /v1/logs)
# =========================================================================
[OUTPUT]
    Name          http
    Match         *
    Host          sentinel.yourbank.internal
    Port          443
    URI           /v1/logs
    Format        json
    Header        X-Sentinel-Environment ${SENTINEL_ENV}
    Header        Authorization Bearer ${SENTINEL_SHIPPER_TOKEN}
    Tls           On
    Tls.verify    On
    Retry_Limit   5
