apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: sentinel-monitoring
data:
  config.yaml: |
    receivers:
      kubeletstats:
        collection_interval: 30s
        auth_type: "serviceAccount"
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups:
          - container
          - pod
          - node
    processors:
      batch:
        send_batch_size: 500
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_mib: 64
        spike_limit_mib: 16
    exporters:
      otlphttp:
        endpoint: "https://sentinel.yourbank.internal/v1/metrics"
        headers:
          Authorization: "Bearer SF-INFRA-OTEL-TOKEN"
    service:
      pipelines:
        metrics:
          receivers: [kubeletstats]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: sentinel-monitoring
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector-sa
      containers:
        - name: otel-collector
          image: artifactory-prod.internal.corp/docker/otel/opentelemetry-collector-contrib:0.95.0
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
