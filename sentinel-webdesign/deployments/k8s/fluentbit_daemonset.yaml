apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sentinel-fluentbit
  namespace: sentinel-monitoring
  labels:
    app.kubernetes.io/name: sentinel-fluentbit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-fluentbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-fluentbit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.0.4
        resources:
          limits:
            memory: 256Mi
            cpu: 200m
          requests:
            memory: 64Mi
            cpu: 50m
        env:
        - name: SENTINEL_ENV
          valueFrom:
            configMapKeyRef:
              name: sentinel-cluster-config
              key: environment
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
