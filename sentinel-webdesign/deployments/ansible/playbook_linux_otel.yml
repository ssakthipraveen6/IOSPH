---
- name: Deploy OpenTelemetry Collector to Enterprise Linux Fleet
  hosts: linux_servers
  become: yes
  vars:
    artifactory_rpm_url: "https://artifactory-prod.internal.corp/artifactory/binaries/otelcol-contrib-0.95.0.x86_64.rpm"
    sentinel_url: "https://sentinel.yourbank.internal/v1/metrics"
    otel_token: "{{ lookup('env', 'SF_INFRA_OTEL_TOKEN') | default('SF-INFRA-OTEL-TOKEN', true) }}"

  tasks:
    - name: Download otelcol-contrib RPM package from internal Artifactory
      get_url:
        url: "{{ artifactory_rpm_url }}"
        dest: "/tmp/otelcol-contrib.rpm"
        mode: '0644'

    - name: Install otelcol-contrib package
      yum:
        name: "/tmp/otelcol-contrib.rpm"
        state: present
        disable_gpg_check: no

    - name: Deploy OpenTelemetry configuration
      copy:
        src: "../opentelemetry_configs/otel_linux_config.yaml"
        dest: "/etc/otelcol-contrib/config.yaml"
        owner: otel
        group: otel
        mode: '0640'
      notify: Restart OTel Collector

    - name: Ensure otelcol-contrib service is enabled and started
      systemd:
        name: otelcol-contrib
        enabled: yes
        state: started

  handlers:
    - name: Restart OTel Collector
      systemd:
        name: otelcol-contrib
        state: restarted
