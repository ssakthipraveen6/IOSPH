# =========================================================================
# UNIFIED COLLECTION DEFINITION: Kubernetes Infrastructure Clusters
# =========================================================================
id: "k8s"
kind: "infrastructure"
display_name: "Kubernetes Infrastructure Clusters"
category: "orchestration"
poll_interval_seconds: 120
credential_purpose: "service_account"
api: "https://k8s-apiserver-prod.internal.corp:6443"

metrics:
  provider: "opentelemetry"
  scrape_interval: "60s"
  monitored_metrics:
    - "k8s.node.cpu.utilization"
    - "k8s.pod.phase"
    - "k8s.container.restarts"

logs:
  log_tag: "[K8S-CLUSTER]"
  log_path: "d:\\production_shares\\nas_logs\\k8s_events.log"

credentials:
  safe: "SF-INFRA-K8S"
  objects:
    service_account: "K8S-SA-TOKEN"
