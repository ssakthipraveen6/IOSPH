id: auto_remediation_service
kind: application
display_name: Autonomous Remediation Service
category: ai_tooling
tier: Tier-1 Mission Critical
log_tag: '[AUTONOMOUS-REMEDIATION]'
regions:
  - emea
endpoints:
  prod:
    api: https://remediation-engine-prod.internal.corp/api/v1
    vip: https://auto-remediation-service-prod.internal.corp
  stg:
    api: https://remediation-engine-stg.internal.corp/api/v1
    vip: https://auto-remediation-service-stg.internal.corp
auth:
  scheme: bearer_token
  credential_purpose: api_token
  cert_purpose: null
  username_purpose: null
  session: null
topology:
  build_clusters:
    - id: k8s-ai-helpers
      purpose: ai_tooling
      region: emea
lifecycle:
  refweb_url:
    url: https://remediation.internal.corp
    expiry: '2027-12-31'
  license:
    type: Internal Proprietary
    expiry: '2029-01-01'
  certificates:
    - { name: vip-tls, probe: "auto-remediation-service-prod.internal.corp:443" }
layers:
  k8s:
    api: https://k8s-apiserver-prod.internal.corp:6443
    namespace: remediation-engine
    credential_purpose: null
  vip: https://auto-remediation-service-prod.internal.corp
  hosts:
    - auto-remediation-service-node-01.internal.corp
    - auto-remediation-service-node-02.internal.corp
  shares:
    - /mnt/nfs/production_shares/auto-remediation-service
  databases:
    - jdbc:postgresql://db-prod-auto-remediation-service.internal.corp:5432/auto_remediation_service_db
  clusters:
    - k8s-prod-auto-remediation-service
metrics:
  provider: opentelemetry
  scrape_interval: 15s
metrics_baseline:
  responseTime: 50
  successRate: 99.9
  requests: 100
logs:
  log_tag: '[AUTONOMOUS-REMEDIATION]'
  log_path: d:\production_shares\nas_logs\auto_remediation.log
credentials:
  safe: SF-AI-HELPERS-PROD
  objects:
    api_token: REMEDIATION-ENGINE-TOKEN

# Paths whose changes SENTINEL tracks on this product's hosts (osquery file
# events, Phase A5). Default install locations: confirm with the product team.
# '%' matches one level, '%%' recurses. Regenerate the pack with
# `npm run agent:osquery-pack` after editing.
watch:
  linux:
    - "/opt/auto-remediation-service/conf/%%"
    - "/opt/auto-remediation-service/bin/%%"
  windows: []
