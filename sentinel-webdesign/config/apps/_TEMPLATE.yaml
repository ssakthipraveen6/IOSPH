#           status: 200
#           body_contains: "OK"
#           max_ms: 2000
#     cleanup: []

# Paths whose changes SENTINEL tracks on this app's hosts (osquery file events).
# '%' matches one level, '%%' recurses. Run `npm run agent:osquery-pack` after editing.
# watch:
#   linux:
#     - "/opt/mytool/conf/%%"
#   windows:
#     - "D:\\Apps\\MyTool\\conf\\%%"

# Product log files on the app's own hosts, tailed by the SENTINEL agent.
# logs:
#   host_paths:
#     - "/opt/mytool/logs/*.log"
#
# Process monitoring & cardinality guard (Phase O2).
# processes:
#   names: ["mytool", "java"]
#   max_age_hours: 24
#   expected_instances: 2
#
# Certificate paths and keystores inspected by the agent probe.
# certificates:
#   paths:
#     - "/etc/ssl/certs/mytool.crt"
#   keystores:
#     - "/opt/mytool/conf/keystore.p12"
#
# Opt-in local JMX telemetry for Java applications.
# jvm:
#   jmx_port: 9010
#
# Mark true for Windows IIS hosts to enable Web Service & App Pool WAS perf counters.
# iis: false
#
# Health check URLs evaluated by the synthetics engine.
