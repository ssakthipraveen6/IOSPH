# =========================================================================
# UNIFIED COLLECTION DEFINITION: ArgoCD GitOps Operator
# =========================================================================
id: "argocd"
kind: "application"
display_name: "ArgoCD GitOps Operator"
category: "gitops"
tier: "Tier-1 Mission Critical"
log_tag: "[ARGOCD]"

endpoints:
  prod:
    api: "https://argocd-prod.internal.corp/api/v1"
  stg:
    api: "https://argocd-stg.internal.corp/api/v1"

layers:
  api_token:
    credential_purpose: "api_token"
  sso:
    api: "https://sso-auth-prod-argocd.internal.corp/oauth2/token"
    credential_purpose: "sso"
  k8s:
    api: "https://k8s-apiserver-prod.internal.corp:6443"
    namespace: "argocd"
    credential_purpose: null

servers:
  unix:
    - node: "argocd-server-1"
      api: "https://linux-compute-prod-argocd-1.internal.corp/api/v1/metrics"
  windows: []

metrics:
  provider: "opentelemetry"
  scrape_interval: "30s"
  health_thresholds:
    sync_failed_count_critical: 1
    api_latency_warn_ms: 800

metrics_baseline:
  responseTime: 75
  successRate: 99.9
  requests: 150

logs:
  log_tag: "[ARGOCD]"
  log_path: "d:\\production_shares\\nas_logs\\argocd.log"
  retention_days: 30

credentials:
  safe: "SF-ARGOCD-PROD"
  objects:
    api_token: "ARGOCD-API-TOKEN"
    sso: "ARGOCD-SSO-SVC"

jenkins_remediation_job: "JOB_RESTART_ARGOCD_PODS"
