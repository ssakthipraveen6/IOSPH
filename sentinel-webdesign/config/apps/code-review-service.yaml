id: code_review_service
kind: application
display_name: AI Code Review Assistant
category: ai_tooling
tier: Tier-2 Operational
log_tag: '[AI-REVIEW]'
regions:
  - emea
endpoints:
  prod:
    api: https://code-review-prod.internal.corp/api/v1
    vip: https://code-review-service-prod.internal.corp
  stg:
    api: https://code-review-stg.internal.corp/api/v1
    vip: https://code-review-service-stg.internal.corp
auth:
  scheme: bearer_token
  credential_purpose: api_token
  cert_purpose: null
  username_purpose: null
  session: null
topology:
  build_clusters:
    - id: k8s-ai-helpers
      purpose: ai_tooling
      region: emea
lifecycle:
  refweb_url:
    url: https://code-review.internal.corp
    expiry: '2027-12-31'
  license:
    type: Internal Proprietary
    expiry: '2029-01-01'
  certificates:
    - { name: vip-tls, probe: "code-review-service-prod.internal.corp:443" }
layers:
  k8s:
    api: https://k8s-apiserver-prod.internal.corp:6443
    namespace: ai-services
    credential_purpose: null
  vip: https://code-review-service-prod.internal.corp
  hosts:
    - code-review-service-node-01.internal.corp
    - code-review-service-node-02.internal.corp
  shares:
    - /mnt/nfs/production_shares/code-review-service
  databases:
    - jdbc:postgresql://db-prod-code-review-service.internal.corp:5432/code_review_service_db
  clusters:
    - k8s-prod-code-review-service
metrics:
  provider: opentelemetry
  scrape_interval: 30s
metrics_baseline:
  responseTime: 180
  successRate: 99.1
  requests: 40
logs:
  log_tag: '[AI-REVIEW]'
  log_path: d:\production_shares\nas_logs\code_review.log
credentials:
  safe: SF-AI-HELPERS-PROD
  objects:
    api_token: AI-REVIEW-TOKEN

# Paths whose changes SENTINEL tracks on this product's hosts (osquery file
# events, Phase A5). Default install locations: confirm with the product team.
# '%' matches one level, '%%' recurses. Regenerate the pack with
# `npm run agent:osquery-pack` after editing.
watch:
  linux:
    - "/opt/code-review-service/conf/%%"
    - "/opt/code-review-service/bin/%%"
  windows: []
