# =========================================================================
# UNIFIED COLLECTION DEFINITION: GitHub Enterprise Cloud / Server
# =========================================================================
id: "github"
kind: "application"
display_name: "GitHub Enterprise Cloud / Server"
category: "source_control"
tier: "Tier-1 Mission Critical"
log_tag: "[GITHUB]"

endpoints:
  prod:
    api: "https://api.github.com"
  stg:
    api: "https://api.github.com"

layers:
  api_token:
    credential_purpose: "api_token"
  avi:
    api: "https://avi-prod-github.internal.corp/api/v1/telemetry"
    credential_purpose: null

servers:
  unix: []
  windows: []

metrics:
  provider: "opentelemetry"
  scrape_interval: "30s"

metrics_baseline:
  responseTime: 65
  successRate: 99.9
  requests: 200

logs:
  log_tag: "[GITHUB]"
  log_path: "d:\\production_shares\\nas_logs\\github.log"

credentials:
  safe: "SF-GITHUB-PROD"
  objects:
    api_token: "GITHUB-PAT"

jenkins_remediation_job: "JOB_RECONNECT_GITHUB_WEBHOOKS"
