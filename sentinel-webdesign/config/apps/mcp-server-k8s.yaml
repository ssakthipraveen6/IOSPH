id: mcp_server_k8s
kind: application
display_name: Model Context Protocol Server (k8s)
category: ai_tooling
tier: Tier-2 Operational
log_tag: '[MCP-K8S]'
regions:
  - emea
endpoints:
  prod:
    api: https://mcp-server-prod.internal.corp/api/v1
    vip: https://mcp-server-k8s-prod.internal.corp
  stg:
    api: https://mcp-server-stg.internal.corp/api/v1
    vip: https://mcp-server-k8s-stg.internal.corp
auth:
  scheme: bearer_token
  credential_purpose: api_token
  cert_purpose: null
  username_purpose: null
  session: null
topology:
  build_clusters:
    - id: k8s-ai-helpers
      purpose: ai_tooling
      region: emea
lifecycle:
  refweb_url:
    url: https://mcp.internal.corp
    expiry: '2027-12-31'
  license:
    type: Internal Open Source
    expiry: '2028-01-01'
  certificates:
    - { name: vip-tls, probe: "mcp-server-k8s-prod.internal.corp:443" }
layers:
  k8s:
    api: https://k8s-apiserver-prod.internal.corp:6443
    namespace: mcp-server
    credential_purpose: null
  vip: https://mcp-server-k8s-prod.internal.corp
  hosts:
    - mcp-server-k8s-node-01.internal.corp
    - mcp-server-k8s-node-02.internal.corp
  shares:
    - /mnt/nfs/production_shares/mcp-server-k8s
  databases:
    - jdbc:postgresql://db-prod-mcp-server-k8s.internal.corp:5432/mcp_server_k8s_db
  clusters:
    - k8s-prod-mcp-server-k8s
servers:
  unix:
    - node: mcp-server-1
      api: https://linux-compute-prod-mcp-1.internal.corp/api/v1/metrics
  windows: []
metrics:
  provider: opentelemetry
  scrape_interval: 30s
metrics_baseline:
  responseTime: 90
  successRate: 99.7
  requests: 55
logs:
  log_tag: '[MCP-K8S]'
  log_path: d:\production_shares\nas_logs\mcp_server.log
credentials:
  safe: SF-AI-HELPERS-PROD
  objects:
    api_token: MCP-SERVER-TOKEN
jenkins_remediation_job: JOB_RESTART_MCP_SERVER
journeys:
  - id: mcp_server_health
    name: MCP Server Health & Registered Tools
    enabled: false
    interval_seconds: 60
    timeout_seconds: 30
    credentials_purpose: api_token
    steps:
      - id: health_check
        name: Server Ping
        type: http
        layer: network
        url: /healthz
        assert:
          status: 200
          max_ms: 1500
      - id: tools_list
        name: Registered MCP Tools
        type: http
        layer: app
        url: /tools
        assert:
          status: 200
          max_ms: 2000
  - id: mcp_context_flow
    name: MCP Prompts & Resource Templates
    enabled: false
    interval_seconds: 60
    timeout_seconds: 30
    credentials_purpose: api_token
    steps:
      - id: prompts_list
        name: List Prompts
        type: http
        layer: app
        url: /prompts
        assert:
          status: 200
          max_ms: 2000
      - id: resources_list
        name: List Resources
        type: http
        layer: storage
        url: /resources
        assert:
          status: 200
          max_ms: 2500

# Paths whose changes SENTINEL tracks on this product's hosts (osquery file
# events, Phase A5). Default install locations: confirm with the product team.
# '%' matches one level, '%%' recurses. Regenerate the pack with
# `npm run agent:osquery-pack` after editing.
watch:
  linux:
    - "/opt/mcp-server/conf/%%"
    - "/opt/mcp-server/bin/%%"
  windows: []
