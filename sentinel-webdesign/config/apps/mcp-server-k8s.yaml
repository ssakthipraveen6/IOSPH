# =========================================================================
# UNIFIED COLLECTION DEFINITION: Model Context Protocol K8s Server
# =========================================================================
id: "mcp_server_k8s"
kind: "application"
display_name: "Model Context Protocol Server (k8s)"
category: "ai_tooling"
tier: "Tier-2 Operational"
log_tag: "[MCP-K8S]"
regions: ["emea"]

endpoints:
  prod:
    api: "https://mcp-server-prod.internal.corp/api/v1"
  stg:
    api: "https://mcp-server-stg.internal.corp/api/v1"

auth:
  scheme: "bearer_token"
  credential_purpose: "api_token"
  cert_purpose: null
  username_purpose: null
  session: null

topology:
  build_clusters:
    - { id: "k8s-ai-helpers", purpose: "ai_tooling", region: "emea" }

lifecycle:
  refweb_url: { url: "https://mcp.internal.corp", expiry: "2027-12-31" }
  license: { type: "Internal Open Source", expiry: "2028-01-01" }

layers:
  k8s:
    api: "https://k8s-apiserver-prod.internal.corp:6443"
    namespace: "mcp-server"
    credential_purpose: null

servers:
  unix:
    - node: "mcp-server-1"
      api: "https://linux-compute-prod-mcp-1.internal.corp/api/v1/metrics"
  windows: []

metrics:
  provider: "opentelemetry"
  scrape_interval: "30s"

metrics_baseline:
  responseTime: 90
  successRate: 99.7
  requests: 55

logs:
  log_tag: "[MCP-K8S]"
  log_path: "d:\\production_shares\\nas_logs\\mcp_server.log"

credentials:
  safe: "SF-AI-HELPERS-PROD"
  objects:
    api_token: "MCP-SERVER-TOKEN"

jenkins_remediation_job: "JOB_RESTART_MCP_SERVER"
