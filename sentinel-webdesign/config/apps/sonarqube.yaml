# =========================================================================
# UNIFIED COLLECTION DEFINITION: SonarQube Code Quality Platform
# =========================================================================
id: "sonarqube"
kind: "application"
display_name: "SonarQube Code Quality Platform"
category: "code_quality"
tier: "Tier-2 Operational"
log_tag: "[SONARQUBE]"

endpoints:
  prod:
    api: "https://sonarqube-prod.internal.corp/api"
  stg:
    api: "https://sonarqube-stg.internal.corp/api"

layers:
  api_token:
    credential_purpose: "api_token"
  avi:
    api: "https://avi-prod-sonarqube.internal.corp/api/v1/telemetry"
    credential_purpose: null

servers:
  unix:
    - node: "sonarqube-server-1"
      api: "https://linux-compute-prod-sonarqube-1.internal.corp/api/v1/metrics"
  windows: []

metrics:
  provider: "opentelemetry"
  scrape_interval: "30s"

metrics_baseline:
  responseTime: 120
  successRate: 99.6
  requests: 70

logs:
  log_tag: "[SONARQUBE]"
  log_path: "d:\\production_shares\\nas_logs\\sonarqube.log"

credentials:
  safe: "SF-SONARQUBE-PROD"
  objects:
    api_token: "SONARQUBE-API-TOKEN"

jenkins_remediation_job: "JOB_RESTART_SONARQUBE"
