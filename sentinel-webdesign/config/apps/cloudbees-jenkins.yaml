id: cloudbees_jenkins
kind: application
display_name: CloudBees Jenkins CI/CD
category: ci_cd
tier: Tier-1 Mission Critical
log_tag: '[JENKINS]'
regions:
  - emea
  - apac
  - amer
aliases:
  - jenkins
  - jenkins_k8s
endpoints:
  prod:
    api: https://jenkins-prod.internal.corp/job
    vip: https://cloudbees-jenkins-prod.internal.corp
  stg:
    api: https://jenkins-stg.internal.corp/job
    vip: https://cloudbees-jenkins-stg.internal.corp
auth:
  scheme: basic_token
  credential_purpose: api_token
  cert_purpose: null
  username_purpose: service_user
  session: null
jvm:
  jmx_port: 5000
topology:
  operations_centers:
    - id: oc-01
      region: emea
      url: https://oc01.internal.corp
      k8s_cluster: k8s-oc-emea-01
      controllers:
        - id: oc-01-aps
          flavour: APS
          url: https://oc01-aps.internal.corp
        - id: oc-01-dev
          flavour: DEV
          url: https://oc01-dev.internal.corp
    - id: oc-02
      region: apac
      url: https://oc02.internal.corp
      k8s_cluster: k8s-oc-apac-01
      controllers:
        - id: oc-02-prod
          flavour: PROD
          url: https://oc02-prod.internal.corp
  agent_pools:
    - id: win-build
      os: windows
      expected_count: 200
      discovery: jenkins_api
    - id: linux-docker
      os: linux
      expected_count: 50
      discovery: jenkins_api
  jump_servers:
    - host: jump-01.internal.corp
      os: linux
    - host: jump-02.internal.corp
      os: linux
  build_clusters:
    - id: k8s-ci-build
      purpose: ci
    - id: k8s-cd-build
      purpose: cd
    - id: k8s-cd-apac-build
      purpose: cd
      region: apac
    - id: k8s-cd-amer-build
      purpose: cd
      region: amer
lifecycle:
  refweb_url:
    url: https://jenkins.internal.corp
    expiry: '2027-03-31'
  license:
    type: CloudBees CI
    expiry: '2027-01-15'
  certificates:
    - name: ingress-tls
      probe: jenkins.internal.corp:443
layers:
  db:
    jdbc: jdbc:postgresql://db-prod-jenkins.internal.corp:5432/jenkins_db
    credential_purpose: db
  remediation_token:
    credential_purpose: remediation_token
  k8s:
    api: https://k8s-apiserver-prod.internal.corp:6443
    namespace: jenkins-builds
    credential_purpose: null
  avi:
    api: https://avi-prod-jenkins.internal.corp/api/v1/telemetry
    credential_purpose: null
  vip: https://cloudbees-jenkins-prod.internal.corp
  hosts:
    - cloudbees-jenkins-node-01.internal.corp
    - cloudbees-jenkins-node-02.internal.corp
  shares:
    - /mnt/nfs/production_shares/cloudbees-jenkins
  databases:
    - jdbc:postgresql://db-prod-jenkins.internal.corp:5432/jenkins_db
  clusters:
    - k8s-prod-cloudbees-jenkins
servers:
  unix:
    - node: jenkins-master-1
      api: https://linux-compute-prod-jenkins-1.internal.corp/api/v1/metrics
  windows: []
metrics:
  provider: opentelemetry
  scrape_interval: 30s
  health_thresholds:
    executor_busy_pct_warning: 85
    build_queue_size_critical: 50
metrics_baseline:
  responseTime: 110
  successRate: 99.5
  requests: 80
logs:
  log_tag: '[JENKINS]'
  log_path: d:\production_shares\nas_logs\jenkins_master.log
  retention_days: 30
credentials:
  safe: SF-JENKINS-PROD
  objects:
    db: JENKINS-DB-SVC
    remediation_token: JENKINS-REMEDIATION-TOKEN
jenkins_remediation_job: JOB_RESTART_JENKINS_MASTER
journeys:
  - id: jenkins_canary_pipeline
    name: Jenkins Canary Build & Execution Pipeline
    enabled: false
    interval_seconds: 60
    timeout_seconds: 30
    credentials_purpose: api_token
    steps:
      - id: trigger_canary_build
        name: Trigger Canary No-Op Job
        type: http
        layer: app
        url: /canary-noop/build
        method: POST
        assert:
          status: 201
          max_ms: 2000
      - id: poll_queue_state
        name: Check Build Queue & Wait Time
        type: http
        layer: app
        url: /queue/api/json
        assert:
          status: 200
          max_ms: 1500
      - id: check_agent_allocation
        name: Verify Agent Node Allocation
        type: http
        layer: storage
        url: /computer/api/json
        assert:
          status: 200
          max_ms: 2500
      # [Q2] Trigger the canary job, follow its queue item, read the build:
      #   journey.jenkins.queue_wait_ms = build.timestamp - queueItem.inQueueSince
      #   jenkins.built_on / jenkins.executor attributes, journey.jenkins.build_duration_ms.
      # `type: http` + `action: jenkins_build` runs the Jenkins step (synthetics/steps/jenkins.js).
      - id: canary_queue_wait
        name: Canary Build Queue Wait & Agent Allocation
        type: http
        action: jenkins_build
        layer: app
        jenkins_url: https://jenkins-prod.internal.corp
        job: canary-noop
        auth_type: basic
        poll_interval_ms: 2000
        queue_timeout_ms: 120000
        wait_for_completion: true
        build_timeout_ms: 300000
        expect_result: SUCCESS
        assert:
          max_queue_wait_ms: 60000
  - id: jenkins_api_health
    name: Jenkins Master Core API Health
    enabled: false
    interval_seconds: 60
    timeout_seconds: 30
    credentials_purpose: api_token
    steps:
      - id: master_api_json
        name: Master Summary JSON
        type: http
        layer: network
        url: /api/json
        assert:
          status: 200
          max_ms: 1500
      - id: quieting_down
        name: Quiet Down Status
        type: http
        layer: app
        url: /quietDown/api/json
        assert:
          status: 200
          max_ms: 1500

# Paths whose changes SENTINEL tracks on this product's hosts (osquery file
# events, Phase A5). Default install locations: confirm with the product team.
# '%' matches one level, '%%' recurses. Regenerate the pack with
# `npm run agent:osquery-pack` after editing.
watch:
  linux:
    - "/var/lib/jenkins/%.xml"
    - "/var/lib/jenkins/init.groovy.d/%%"
    - "/var/lib/jenkins/plugins/%.jpi"
  windows: []
