# PostgreSQL read-only monitoring queries for sqlquery receiver
# All queries MUST start with SELECT or WITH.
# Credentials provided via environment variables.

queries:
  cache_hit_ratio:
    name: postgresql.cache_hit_ratio
    interval: 60s
    statement: >-
      SELECT
        CASE WHEN (sum(heap_blks_hit) + sum(heap_blks_read)) = 0 THEN 100.0
             ELSE round(100.0 * sum(heap_blks_hit) / (sum(heap_blks_hit) + sum(heap_blks_read)), 2)
        END AS cache_hit_pct
      FROM pg_statio_user_tables;

  tablespace_usage:
    name: postgresql.tablespace_usage
    interval: 60s
    statement: >-
      SELECT
        spcname AS tablespace_name,
        pg_tablespace_size(oid) AS bytes_used,
        pg_tablespace_size(oid) AS bytes_allocated,
        pg_tablespace_size(oid) AS autoextend_max_bytes
      FROM pg_tablespace;

  replication_lag:
    name: postgresql.replication_lag
    interval: 60s
    statement: >-
      SELECT
        client_addr AS client_ip,
        application_name,
        COALESCE(EXTRACT(EPOCH FROM (now() - replay_lsn_diff_time)), 0)::float AS lag_seconds,
        COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn), 0) AS lag_bytes
      FROM (
        SELECT client_addr, application_name, replay_lsn, now() AS replay_lsn_diff_time
        FROM pg_stat_replication
      ) rep;

  top_long_running_statements:
    name: postgresql.long_running_statements
    interval: 60s
    statement: >-
      SELECT
        pid,
        usename AS db_user,
        md5(query) AS query_id_hash,
        round(EXTRACT(EPOCH FROM (now() - query_start))::numeric, 2) AS duration_seconds,
        state
      FROM pg_stat_activity
      WHERE state <> 'idle' AND query_start IS NOT NULL
      ORDER BY query_start ASC
      LIMIT 10;

  idle_in_transaction_locks:
    name: postgresql.idle_in_transaction_locks
    interval: 60s
    statement: >-
      WITH locked_sessions AS (
        SELECT DISTINCT pid FROM pg_locks WHERE granted = true
      )
      SELECT
        a.pid,
        a.usename AS db_user,
        round(EXTRACT(EPOCH FROM (now() - a.state_change))::numeric, 2) AS idle_duration_seconds
      FROM pg_stat_activity a
      JOIN locked_sessions l ON a.pid = l.pid
      WHERE a.state = 'idle in transaction'
        AND now() - a.state_change > interval '30 minutes';

  backup_age:
    name: postgresql.backup_age
    interval: 300s
    statement: >-
      SELECT
        COALESCE(round(EXTRACT(EPOCH FROM (now() - pg_stat_file('base/backup_label')::record))::numeric, 0), 0) AS backup_age_seconds
      FROM (SELECT 1) dummy;
