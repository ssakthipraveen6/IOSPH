{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "disable_logging": "false",
    "schedule_splay_percent": "10",
    "events_expiry": "3600",
    "verbose": "false",
    "worker_threads": "2",
    "enable_syslog": "false",
    "disable_events": "false"
  },
  "schedule": {
    "system_info": {
      "query": "SELECT hostname, cpu_brand, physical_memory FROM system_info;",
      "interval": 3600
    },
    "os_version": {
      "query": "SELECT name, version, major, minor, build, platform FROM os_version;",
      "interval": 86400
    },
    "listening_ports": {
      "query": "SELECT pid, port, protocol, address FROM listening_ports WHERE address != '127.0.0.1';",
      "interval": 300
    },
    "installed_packages": {
      "query": "SELECT name, version, release, arch FROM deb_packages UNION SELECT name, version, release, arch FROM rpm_packages;",
      "interval": 86400
    }
  },
  "packs": {
    "sentinel_security": "/etc/sentinel/osquery/packs/sentinel-security.conf",
    "file_changes": "/etc/sentinel/osquery/packs/file-changes.conf"
  }
}
