{
  "queries": {
    "suspicious_outbound_sockets": {
      "query": "SELECT pid, family, protocol, local_address, local_port, remote_address, remote_port FROM process_open_sockets WHERE remote_port IN (4444, 1337, 6667, 31337);",
      "interval": 60,
      "description": "Detect anomalous reverse shell ports"
    },
    "suid_binaries": {
      "query": "SELECT path, username, groupname, permissions FROM suid_binaries;",
      "interval": 86400,
      "description": "Track unexpected setuid binaries"
    },
    "crontab_changes": {
      "query": "SELECT command, path, minute, hour, day_of_month, month, day_of_week FROM crontab;",
      "interval": 3600,
      "description": "Audit scheduled jobs across system and users"
    }
  }
}
