{
  "description": "Generated by scripts/generate_osquery_pack.js from config/apps/*.yaml watch: paths. Do not edit by hand.",
  "platform": "linux",
  "file_paths": {
    "system_binaries": [
      "/usr/bin/%%",
      "/usr/sbin/%%",
      "/bin/%%",
      "/sbin/%%"
    ],
    "ssl_certificates": [
      "/etc/ssl/certs/%%",
      "/etc/pki/tls/certs/%%"
    ],
    "sentinel_agent": [
      "/etc/sentinel/%%",
      "/opt/sentinel/%%"
    ],
    "aquasec": [
      "/opt/aquasec/conf/%%",
      "/etc/aquasec/%%"
    ],
    "argocd": [
      "/etc/argocd/%%",
      "/opt/argocd/conf/%%"
    ],
    "argoworkflows": [
      "/etc/argo-workflows/%%",
      "/opt/argo-workflows/conf/%%"
    ],
    "auto_remediation_service": [
      "/opt/auto-remediation-service/conf/%%",
      "/opt/auto-remediation-service/bin/%%"
    ],
    "bitbucket_external": [
      "/var/atlassian/application-data/bitbucket/shared/%.properties",
      "/opt/atlassian/bitbucket/%%/conf/%%"
    ],
    "bitbucket": [
      "/var/atlassian/application-data/bitbucket/shared/%.properties",
      "/opt/atlassian/bitbucket/%%/conf/%%"
    ],
    "cloudbees_jenkins": [
      "/var/lib/jenkins/%.xml",
      "/var/lib/jenkins/init.groovy.d/%%",
      "/var/lib/jenkins/plugins/%.jpi"
    ],
    "code_review_service": [
      "/opt/code-review-service/conf/%%",
      "/opt/code-review-service/bin/%%"
    ],
    "fortify": [
      "/opt/fortify/ssc/conf/%%",
      "/opt/tomcat/conf/%%",
      "/opt/tomcat/webapps/%.war"
    ],
    "github": [
      "/etc/github/%%",
      "/opt/github/conf/%%"
    ],
    "jetbrains_teamcity": [
      "/opt/teamcity/conf/%%",
      "/opt/teamcity-data/config/%%",
      "/opt/teamcity-data/plugins/%.zip"
    ],
    "jfrog_artifactory": [
      "/opt/jfrog/artifactory/var/etc/%%",
      "/opt/jfrog/artifactory/app/bin/%%"
    ],
    "mcp_server_k8s": [
      "/opt/mcp-server/conf/%%",
      "/opt/mcp-server/bin/%%"
    ],
    "nexusiq": [
      "/opt/nexus-iq-server/%.yml",
      "/opt/nexus-iq-server/%.jar"
    ],
    "otkr": [
      "/opt/otkr/conf/%%",
      "/opt/otkr/bin/%%"
    ],
    "sonarqube": [
      "/opt/sonarqube/conf/%%",
      "/opt/sonarqube/extensions/plugins/%.jar"
    ]
  },
  "queries": {
    "file_events": {
      "query": "SELECT target_path, category, action, md5, sha256, uid, time FROM file_events;",
      "interval": 30,
      "removed": false,
      "description": "File creation, modification and deletion under the watched paths"
    }
  }
}
