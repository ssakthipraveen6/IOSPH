receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  kubeletstats:
    collection_interval: 30s
    auth_type: "serviceAccount"
    endpoint: "https://${env:K8S_NODE_NAME}:10250"
    insecure_skip_verify: true
    metric_groups:
      - node
      - pod
      - container

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  resourcedetection:
    detectors: [env, system]
    timeout: 2s

  resource:
    attributes:
      - key: sentinel.agent.version
        value: "2.4.0"
        action: upsert
      - key: sentinel.agent.os
        value: "kubernetes"
        action: upsert

  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlphttp:
    endpoint: ${env:SENTINEL_GATEWAY_URL}
    headers:
      Authorization: "Bearer ${env:SENTINEL_GATEWAY_TOKEN}"
    compression: gzip
    timeout: 10s

service:
  pipelines:
    metrics:
      receivers: [otlp, kubeletstats]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlphttp]
