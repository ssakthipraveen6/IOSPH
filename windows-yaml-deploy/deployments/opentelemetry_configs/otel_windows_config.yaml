receivers:
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      paging:

  windowsperfcounters:
    collection_interval: 30s
    perf_counters:
      - object: "Web Service"
        instances: ["_Total"]
        counters: ["Current Connections", "Total Bytes Sent", "Total Bytes Received"]

processors:
  batch:
    send_batch_size: 500
    timeout: 10s
  memory_limiter:
    check_interval: 5s
    limit_mib: 64
    spike_limit_mib: 16
  resource:
    attributes:
      - key: environment
        value: "production"
        action: insert

exporters:
  otlphttp:
    # Direct endpoint to Sentinel application URL over standard corporate HTTPS
    endpoint: "https://sentinel.yourbank.internal/v1/metrics"
    headers:
      Authorization: "Bearer SF-INFRA-OTEL-TOKEN"

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, windowsperfcounters]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp]
