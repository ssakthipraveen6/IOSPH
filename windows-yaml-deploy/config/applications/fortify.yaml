id: "fortify"
display_name: "Micro Focus Fortify SSC"
category: "security_scanner"
log_tag: "[FORTIFY]"

endpoints:
  prod:
    api: "https://fortify-prod.internal.corp/ssc/api/v1"
  stg:
    api: "https://fortify-stg.internal.corp/ssc/api/v1"

layers:
  api_token:
    credential_purpose: "api_token"
  avi:
    api: "https://avi-prod-fortify.internal.corp/api/v1/telemetry"
