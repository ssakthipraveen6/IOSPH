id: "otkr"
display_name: "OTKR Compliance Scanner"
category: "compliance"
log_tag: "[OTKR]"

endpoints:
  prod:
    api: "https://otkr-prod.internal.corp/api/v1"
  stg:
    api: "https://otkr-stg.internal.corp/api/v1"

layers:
  avi_api: "https://avi-prod-otkr.internal.corp/api/v1/telemetry"
  db_jdbc: "jdbc:postgresql://db-prod-otkr.internal.corp:5432/otkr_db"
  nas_mount: "d:\\production_shares\\nas_logs\\otkr"
  sso_api: "https://sso-auth-prod-otkr.internal.corp/oauth2/token"
  network_latency_hosts:
    - "otkr-prod.internal.corp"

servers:
  - node: "otkr-node-1"
    type: "linux"
    api: "https://linux-compute-prod-otkr-1.internal.corp/api/v1/metrics"
  - node: "otkr-node-2"
    type: "linux"
    api: "https://linux-compute-prod-otkr-2.internal.corp/api/v1/metrics"

metrics_baseline:
  scanQueue: 2
  findings: 8
  responseTime: 160

jenkins_remediation_job: "JOB_RESTART_OTKR_SCANNER"
